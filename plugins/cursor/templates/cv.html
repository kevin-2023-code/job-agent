<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<style>
  @page { size: {{page_size}}; margin: 14mm 16mm; }
  * { box-sizing: border-box; }
  body { font: 10.2pt/1.38 "Inter", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1a1a1a; margin: 0; }
  h1 { font-size: 20pt; margin: 0 0 2pt; letter-spacing: -0.2pt; }
  h1 + p { margin: 0 0 8pt; color: #444; font-size: 9.4pt; }
  h2 { font-size: 10.5pt; text-transform: uppercase; letter-spacing: 0.8pt; color: #222; border-bottom: 0.8pt solid #bbb; padding-bottom: 2pt; margin: 12pt 0 5pt; }
  h3 { font-size: 10.4pt; margin: 8pt 0 0; }
  h3 + p { margin: 0 0 3pt; color: #555; font-size: 9.4pt; }
  p { margin: 0 0 5pt; }
  ul { margin: 2pt 0 5pt; padding-left: 14pt; }
  li { margin: 0 0 2pt; }
  a { color: inherit; text-decoration: none; }
  em { font-style: normal; }
  code { font-family: inherit; }
  hr { border: 0; border-top: 0.6pt solid #ddd; margin: 8pt 0; }
  h2, h3 { break-after: avoid; }
  li { break-inside: avoid; }
</style>
</head>
<body>
{{body}}
</body>
</html>
