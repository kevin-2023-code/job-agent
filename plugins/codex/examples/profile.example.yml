# Your job-search profile. Copied to profile/profile.yml by `job-agent init`.
# Everything here stays on your machine. The agent reads it before every task.

name: Alex Chen
email: alex@example.com
phone: ""
location: San Francisco, CA
links:
  linkedin: https://www.linkedin.com/in/example
  github: https://github.com/example
  website: ""

targets:
  roles:                       # titles you want, best first
    - Senior Software Engineer
    - Staff Software Engineer
    - Machine Learning Engineer
  level: senior                # junior | mid | senior | staff | principal
  industries: [developer tools, AI infrastructure, fintech]
  company_stage: [series-b, series-c, public]
  min_grade: C                 # the agent advises against applying below this
  why: >
    Want to own a backend system end to end, closer to ML infrastructure,
    on a team that ships weekly.

deal_breakers:                 # any one of these caps a role at grade D
  - On-site 5 days a week
  - No visa sponsorship
  - Pure frontend role

compensation:
  currency: USD
  base_min: 180000
  total_target: 280000
  notes: Open to lower base for meaningful equity at an early-stage company.

location_prefs:
  remote: preferred            # required | preferred | ok | no
  cities: [San Francisco, New York, Seattle]
  relocate: false

work_authorization:
  country: US
  status: H-1B                 # citizen | green card | H-1B | OPT | TN | needs sponsorship ...
  needs_sponsorship: true
  notice_period: 2 weeks
  earliest_start: ""

apply:
  fill_forms: true             # the agent fills application forms in your browser and stops before Submit
  voluntary_disclosures: decline   # decline (pick the form's decline option) | ask_each_time
  cover_letter: when_asked     # always | when_asked | never

# Answers forms keep asking. The agent fills these in for you over time, on your word.
saved_answers:
  how_did_you_hear: Company careers page
  salary_expectation: Open to discussing; targeting the market range for the level.
  willing_to_travel: Up to 10%
